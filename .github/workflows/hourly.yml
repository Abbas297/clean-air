name: Saaf Hawa Hourly Pipeline Cron

on:
  schedule:
    - cron: '15 * * * *'  # Runs every hour at minute 15
  workflow_dispatch:      # Allows manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Prefect Hourly Flow
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: |
          python flows/hourly.py

      - name: Export Unedited Flow Runs
        run: |
          python scripts/export_runs.py

      - name: Commit and Push Updated Heartbeat & Audit Logs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add status.json data/manifest.csv prefect_runs.csv
          git diff --staged --quiet || git commit -m "Automated hourly heartbeat run [skip ci]"
          git push
